name: Package VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VSCE_STORE: file

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Clean generated files
        run: npm run clean

      - name: Compile extension
        run: npm run compile

      - name: Compile tests
        run: npm run compile:test

      - name: Verify extension manifest
        run: npm run verify:manifest

      - name: Run core tests
        run: npm run test:core

      - name: Prepare runtime-only package
        run: |
          npm run clean
          npm run compile
          npm run verify:manifest

      - name: Show files selected for the VSIX
        run: npm exec --yes --package=@vscode/vsce@3.9.2 -- vsce ls --tree --no-dependencies

      - name: Package VSIX
        run: npm exec --yes --package=@vscode/vsce@3.9.2 -- vsce package --no-dependencies --out repobundle-${{ github.ref_name }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: repobundle-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
