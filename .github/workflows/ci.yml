name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Clean generated files
        run: npm run clean

      - name: Compile extension
        run: npm run compile

      - name: Compile tests
        run: npm run compile:test

      - name: Verify extension manifest
        run: npm run verify:manifest

      - name: Run core tests
        run: npm run test:core

  package-smoke:
    name: Package smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSCE_STORE: file

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Clean and compile runtime only
        run: |
          npm run clean
          npm run compile
          npm run verify:manifest

      - name: Show files selected for the VSIX
        run: npm exec --yes --package=@vscode/vsce@3.9.2 -- vsce ls --tree --no-dependencies

      - name: Build VSIX smoke artifact
        run: npm exec --yes --package=@vscode/vsce@3.9.2 -- vsce package --no-dependencies --out repobundle-ci.vsix

      - name: Verify VSIX exists
        run: node -e "const fs=require('node:fs'); const p='repobundle-ci.vsix'; if (!fs.existsSync(p) || fs.statSync(p).size === 0) process.exit(1);"
