name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and test
        run: npm test

  package-smoke:
    name: Package smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSCE_STORE: file

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build VSIX smoke artifact
        run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out repobundle-ci.vsix

      - name: Verify VSIX exists
        run: test -s repobundle-ci.vsix
